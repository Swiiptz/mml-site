<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>MML.init()</title>
    <meta http-equiv="refresh" content="0; url=index.html?lang=en">
    <script>
        const target = new URL("index.html", window.location.href);
        target.searchParams.set("lang", "en");
        target.hash = window.location.hash;
        window.location.replace(target.toString());
    </script>
</head>
<body>
    <p>Redirecting to <a href="index.html?lang=en">the English portfolio</a>.</p>
</body>
</html>
